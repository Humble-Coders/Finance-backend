[pytest]
asyncio_default_fixture_loop_scope = function
markers =
    integration: needs a real Postgres (skipped when no database is configured).
        Constraint behaviour cannot be proven without one — SQLite does not
        implement Postgres UUIDs, enums or partial indexes. The fast CI job
        skips these; the `database` job (#15) runs them against a throwaway
        Postgres 17 with REQUIRE_DB set, so there a missing database fails the
        run instead of silently skipping it.
